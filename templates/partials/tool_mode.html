<div class="ca-tool-mode"><span>{{ seo_meta.title.split(' — ')[0] }}</span><label><input type="checkbox" id="modeToggle" onchange="toggleMode(this)">Expert mode</label>{% if auth_public_enabled() %}<a href="/auth/login">Sign In</a><a href="/auth/register">Sign Up</a>{% endif %}</div>
<style>.ca-tool-mode{display:flex;align-items:center;justify-content:space-between;gap:16px;max-width:1256px;margin:0 auto;padding:12px 28px;border-bottom:1px solid #34393b;font:12px/1.5 Inter,system-ui,sans-serif;color:#b6c6bd}.ca-tool-mode>span{font-weight:650}.ca-tool-mode label{display:flex;align-items:center;gap:8px;white-space:nowrap;min-height:28px;cursor:pointer}.ca-tool-mode input{display:block;appearance:auto;position:static;width:17px;height:17px;min-height:0;margin:0;padding:0;accent-color:#9edcca}.ca-tool-mode a{color:#a6d3bb}@media(max-width:760px){.ca-tool-mode{padding:10px 18px}}</style>
